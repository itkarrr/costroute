[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "itkarrr-costroute"
version = "0.1.0"
description = "把候选项映射到类别上，算出模型路由的成本最优的覆盖率并列出未覆盖的类别"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "itkarrr" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://itkarrr.github.io"
Repository = "https://github.com/itkarrr/costroute"
Issues = "https://github.com/itkarrr/costroute/issues"

[project.scripts]
costroute = "costroute:main"

[tool.setuptools]
py-modules = ["costroute"]
